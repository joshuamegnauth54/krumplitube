[package]
name = "krumplitube"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Android player for Invidious and PeerTube."
readme = "README.md"
repository = "https://github.com/joshuamegnauth54/krumplitube"
license.workspace = true

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

[workspace]
members = ["krumpli_tubers", "krumplipure"]

[workspace.package]
authors = ["Josh Megnauth <jo.sh@tutanota.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
http = "1"
jiff = { version = "0.2", features = ["serde"] }
mime = "0.3"
reqwest = { version = "0.13", features = [
  "deflate",
  "brotli",
  "gzip",
  "hickory-dns",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
tokio = "1"
tracing = { version = "0.1", features = ["log"] }
url = { version = "2", features = ["serde"] }

# Dev dependencies
test-log = { version = "0.2", features = ["trace"] }

[dependencies]
krumpli_tubers = { path = "krumpli_tubers" }
krumplipure = { path = "krumplipure" }
