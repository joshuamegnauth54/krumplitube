name: Build and test Krumpli

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_LOG: debug

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt
        - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: davidlattimore/wild-action@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --all-targets --bins --tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: davidlattimore/wild-action@latest
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --verbose -- --nocapture

  test_android:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android"
      - uses: taiki-e/install-action@cargo-ndk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedCheck
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cargo ndk-test -t arm64-v8a 

  build_android:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android"
      - uses: taiki-e/install-action@cargo-ndk
      - uses: Swatinem/rust-cache@v2
      - run: cargo ndk -t armeabi-v7a -t arm64-v8a -o ./jniLibs build --release
